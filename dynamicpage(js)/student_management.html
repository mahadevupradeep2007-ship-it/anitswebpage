<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Name Manager</title>
    <script src="student_management.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 650px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        #addBtn {
            padding: 12px 20px;
            background: #f0f0f0;
            border: 1px solid #aaa;
            cursor: pointer;
            border-radius: 4px;
        }

        #addBtn:hover {
            background: #ddd;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #9f9fc5;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 5px;
            font-size: 22px;
        }

        .delete-btn {
            background: #ef5b57;
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 16px;
        }

        .delete-btn:hover {
            background: #d63f3b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Name Manager</h1>

        <div class="input-box">
            <input type="text" id="studentInput" placeholder="Enter student name">
            <button id="addBtn" onclick="addStudent()">Add Student</button>
        </div>

        <h2>Total Students: <span id="count">0</span></h2>

        <ul id="studentList"></ul>
    </div>

</body>
</html>
